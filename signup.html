<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Odin Project - Sign Up Form</title>
    <link rel="stylesheet" href="./signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="picture">
            <div id="logo">
                <img src="./odin-lined.png" alt="">
                <h1>ODIN</h1>
            </div>
            <p>Photo by Goutham Krishna on <a href="https://unsplash.com/@tuzbro" class="credit">Unplash</a></p>
        </div>

        <div class="section2">
            <div class="paragraph">
                <p>This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
                Sign up now to get started.
                <span>
                You know you want to.
                </span>
                </p>
            </div>
            
            <div class="form">
                <h4>Let's do this</h4>
                <form action="">
                    <div class="form-container">
                        <div class="form-group">
                            <label for="">FIRST NAME</label>
                            <input type="text">
                        </div>

                        <div class="form-group">
                            <label for="">LAST NAME</label>
                            <input type="text">
                        </div>
                        
                        <div class="form-group">
                            <label for="">EMAIL</label>
                            <input type="email">
                        </div>

                        <div class="form-group">
                            <label for="">PHONE NUMBER</label>
                            <input type="number">
                        </div>
                    
                        <div class="form-group">
                            <label for="">PASSWORD</label>
                            <input type="password" required>
                        </div>

                        <div class="form-group">
                            <label for="">CONFIRM PASSWORD</label>
                            <input type="password" required>
                        </div>
                    </div>
                </form>
            </div>
        
            <div class="btn-container">
                <button class="btn">Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>        
        </div>
    </div>
</body>
</html>
